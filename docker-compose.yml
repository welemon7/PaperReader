 version: "3.8"
 
 services:
   minio:
     image: minio/minio:RELEASE.2024-07-16T23-46-30Z
     container_name: paper-minio
     ports:
       - "9000:9000"   # API
       - "9001:9001"   # Console
     environment:
       MINIO_ROOT_USER: minioadmin
       MINIO_ROOT_PASSWORD: minioadmin123
     volumes:
       - minio_data:/data
     command: server /data --console-address ":9001"
     healthcheck:
       test: ["CMD", "mc", "ready", "local"]
       interval: 5s
       timeout: 5s
       retries: 5
 
 volumes:
   minio_data:
