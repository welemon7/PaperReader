<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Reader LLM - 学术海报生成器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="10" fill="#1a365d"/>
                    <path d="M12 12h16v4H12v-4zm0 8h16v4H12v-4zm0 8h10v4H12v-4z" fill="white"/>
                    <path d="M26 28l4-4v8l-4-4z" fill="#c9a84c"/>
                </svg>
                <h1>Paper Poster Generator</h1>
            </div>
            <div class="status-badge" id="healthStatus">
                <span class="dot"></span>
                <span>检查中...</span>
            </div>
        </header>

        <!-- Main Form -->
        <section class="form-section">
            <div class="form-card">
                <h2>生成学术海报</h2>
                <p class="subtitle">输入 arXiv ID，自动生成初稿和优化版 HTML 海报</p>

                <form id="generateForm">
                    <div class="form-group">
                        <label for="arxivId">arXiv ID</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📄</span>
                            <input
                                type="text"
                                id="arxivId"
                                placeholder="例如: 2212.04711"
                                required
                                autofocus
                            >
                        </div>
                        <small>支持 arXiv ID 格式: 2212.04711 或 2212.04711v1</small>
                    </div>

                    <div class="form-group">
                        <label for="customPrompt">自定义优化提示词（可选）</label>
                        <textarea
                            id="customPrompt"
                            rows="4"
                            placeholder="输入自定义的优化提示词，或留空使用默认提示词..."
                        ></textarea>
                        <small>默认提示词位于 LLM-up.txt</small>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-primary">
                        <span class="btn-icon">🚀</span>
                        生成海报
                    </button>
                </form>
            </div>
        </section>

        <!-- Progress Section -->
        <section class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-card">
                <h3>生成进度</h3>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
                <div class="progress-info">
                    <span id="progressMessage">初始化...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-steps">
                    <div class="step" id="step1">
                        <span class="step-icon">📥</span>
                        <span>解析论文</span>
                    </div>
                    <div class="step" id="step2">
                        <span class="step-icon">🧠</span>
                        <span>理解内容</span>
                    </div>
                    <div class="step" id="step3">
                        <span class="step-icon">📐</span>
                        <span>设计布局</span>
                    </div>
                    <div class="step" id="step4">
                        <span class="step-icon">🖼️</span>
                        <span>生成初稿</span>
                    </div>
                    <div class="step" id="step5">
                        <span class="step-icon">✨</span>
                        <span>优化海报</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Result Section -->
        <section class="result-section" id="resultSection" style="display: none;">
            <div class="result-card">
                <h3>✅ 生成完成！</h3>
                <div class="result-info">
                    <p><strong>arXiv ID:</strong> <span id="resultArxivId"></span></p>
                    <p><strong>输出目录:</strong> <span id="resultOutputDir"></span></p>
                </div>

                <div class="preview-container">
                    <div class="preview-card">
                        <h4>📄 初稿</h4>
                        <p class="preview-desc">基于论文内容的静态生成</p>
                        <div class="preview-actions">
                            <a href="#" id="viewDraft" class="btn-outline" target="_blank">预览</a>
                            <a href="#" id="downloadDraft" class="btn-outline">下载</a>
                        </div>
                    </div>
                    <div class="preview-card highlight">
                        <h4>✨ 优化版</h4>
                        <p class="preview-desc">经过 LLM 优化后的版本</p>
                        <div class="preview-actions">
                            <a href="#" id="viewOptimized" class="btn-primary" target="_blank">预览</a>
                            <a href="#" id="downloadOptimized" class="btn-outline">下载</a>
                        </div>
                    </div>
                </div>

                <div class="result-actions">
                    <button id="downloadAllBtn" class="btn-secondary">
                        📦 下载全部 (ZIP)
                    </button>
                    <button id="newTaskBtn" class="btn-outline">
                        🔄 生成新的
                    </button>
                </div>
            </div>
        </section>

        <!-- Error Section -->
        <section class="error-section" id="errorSection" style="display: none;">
            <div class="error-card">
                <h3>❌ 生成失败</h3>
                <p id="errorMessage"></p>
                <button id="retryBtn" class="btn-primary">🔄 重试</button>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
