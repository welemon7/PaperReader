[build-system]
requires = ["setuptools>=68.0", "wheel"]
 build-backend = "setuptools.build_meta"

[project]
name = "paper-reader-llm"
 version = "0.1.0"
 description = "Paper to Poster — 论文阅读辅助Agent"
 requires-python = ">=3.10"
 
 dependencies = [
     # Core
     "langgraph>=0.3.0",
     "langchain-core>=0.3.0",
     "pydantic>=2.0",
     "pydantic-settings>=2.0",
 
     # LaTeX parsing
     "texsoup>=0.3",
     "latex2mathml>=3.0",
 
     # Storage
     "sqlalchemy>=2.0",
     "aiosqlite>=0.20",
     "minio>=7.2",
 
     # HTTP / arXiv
     "httpx>=0.27",
     "arxiv>=2.1",
 
     # Utils
     "pyyaml>=6.0",
     "python-dotenv>=1.0",
     "pillow>=10.0",
 
     # API
     "fastapi>=0.110",
    "jinja2>=3.0",
    "Markdown>=3.5",
     "uvicorn[standard]>=0.27",
 ]
 
 [project.optional-dependencies]
 dev = [
     "pytest>=8.0",
     "pytest-asyncio>=0.23",
     "pytest-cov>=5.0",
     "ruff>=0.5",
 ]
 
 [tool.setuptools.packages.find]
 where = ["src"]
 
 [tool.ruff]
 line-length = 100
 target-version = "py310"
 
 [tool.pytest.ini_options]
 testpaths = ["tests"]
 python_files = ["test_*.py"]
 
 [project.scripts]
 parse-paper = "src.main:cli_entry"
